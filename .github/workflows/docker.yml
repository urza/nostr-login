# Tests the solution, then builds the Nostr Guestbook image for amd64 and arm64.
# Push to main publishes ghcr.io/<owner>/<repo>:latest and :sha-<commit>. A tag v1.2.3 also
# publishes :1.2.3 and :1.2. Pull requests only build, they do not publish.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # nak runs a local relay and a NIP-46 signer for the end-to-end tests. Without it,
      # those tests are skipped, not failed.
      - name: Install nak
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o ~/.local/bin/nak https://github.com/fiatjaf/nak/releases/download/v0.20.7/nak-v0.20.7-linux-amd64
          chmod +x ~/.local/bin/nak
      - run: dotnet test tests/NostrAuth.Tests

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the name, which ghcr.io requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # No QEMU needed: the Dockerfile cross-compiles in an SDK stage on the runner's platform.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
